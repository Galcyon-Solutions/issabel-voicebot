; Voicebot galcymedia (ejemplo 02-agent) en Issabel. Incluido desde extensions_custom.conf.
; Marcar @EXT_BOT@ desde cualquier extension: el agente de voz atiende.
; Si el bot decide "pasar a una persona", pasa a @EXT_HUMANO@ (una extension o una cola, por ejemplo 7000).
; El agente corre en esta misma maquina (127.0.0.1).

[from-internal-custom]
exten => @EXT_BOT@,1,Gosub(voicebot,s,1(deepgram))
 same => n,GotoIf($["${BOT_ACTION}" = "transfer"]?transferir,s,1)
 same => n,Hangup()

[voicebot]
exten => s,1,Answer()
 same => n,Set(_AI_PROVIDER=${ARG1})
 same => n,Set(_AI_LANGUAGE=es)
 same => n,Set(_CALL_ORIGIN=${CALLERID(num)})
 same => n,Set(_CALL_ID=${UNIQUEID})
 same => n,Set(CHANNEL(hangup_handler_push)=galcymedia,s,1)
 same => n,MixMonitor(,r(${UNIQUEID}-caller.wav)t(${UNIQUEID}-bot.wav)i(RECID))
 same => n,Dial(WebSocket/voicebot/c(alaw)f(json),3600,g)
 same => n,StopMixMonitor(${RECID})
 same => n,AGI(agi://127.0.0.1:4573/after-dial,${CALL_ID})
 same => n,Return()

[galcymedia]
exten => s,1,AGI(agi://127.0.0.1:4573/hangup,${CALL_ID})
 same => n,Set(CDR(userfield)=${BOT_ACTION})
 same => n,Return()

[transferir]
; Goto a from-internal: sirve para una extension, una cola, un grupo de timbrado o cualquier numero interno
exten => s,1,NoOp(Pasando a una persona: ${BOT_REASON})
 same => n,Goto(from-internal,@EXT_HUMANO@,1)
